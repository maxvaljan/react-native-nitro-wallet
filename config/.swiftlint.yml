excluded:
  - apps/example/ios/Pods
  - apps/example/ios/build
  - packages/react-native-nitro-wallet/nitrogen

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

file_length:
  warning: 300
  error: 500
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 80
  error: 120

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

disabled_rules:
  - trailing_comma
